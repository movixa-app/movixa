<style>
:root{--red:#e50914;--dark:#050001}
*{box-sizing:border-box;margin:0;padding:0}
html{-webkit-text-size-adjust:100%;background:#050001}
body{min-height:100vh;color:#fff;font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;text-align:center;overflow-x:hidden;
 background:radial-gradient(ellipse 80% 55% at 50% 22%,#4a0508 0%,#150204 50%,var(--dark) 100%) fixed;
 padding:calc(40px + env(safe-area-inset-top)) 16px calc(32px + env(safe-area-inset-bottom))}
.wrap{max-width:720px;margin:0 auto;display:flex;flex-direction:column;align-items:center}
.logo{width:104px;height:104px;border-radius:24px;filter:drop-shadow(0 0 22px rgba(229,9,20,.55))}
h1{margin-top:18px;font-size:clamp(34px,9vw,56px);letter-spacing:.1em;font-weight:800;color:#fff}
h1 b{color:var(--red);font-weight:800}
.tag{margin-top:8px;font-size:12px;letter-spacing:.38em;color:#bdbdbd}
.stage{display:flex;justify-content:center;align-items:center;margin:34px 0 34px;perspective:1200px}
.phone{width:min(210px,40vw);aspect-ratio:420/670;border-radius:26px;padding:5px;
 background:linear-gradient(145deg,#3a3a3f,#0b0b0d 45%,#2a2a2e);
 box-shadow:0 0 0 1.5px #555,0 26px 50px rgba(0,0,0,.75),0 0 70px rgba(229,9,20,.28)}
.phone img{width:100%;height:100%;display:block;border-radius:21px;object-fit:cover;background:#000}
.l{transform:rotateY(12deg) rotateZ(-3deg) translateX(10%);z-index:1}
.r{transform:rotateY(-12deg) rotateZ(3deg) translateX(-10%) translateY(-12px);z-index:2}
.btn{display:inline-flex;align-items:center;gap:10px;background:var(--red);color:#fff;text-decoration:none;font-weight:700;font-size:19px;
 padding:17px 40px;border-radius:50px;box-shadow:0 8px 30px rgba(229,9,20,.5);transition:transform .15s,box-shadow .15s;-webkit-tap-highlight-color:transparent}
.btn:active{transform:scale(.97)}
.btn:hover{box-shadow:0 10px 40px rgba(229,9,20,.7)}
.btn svg{width:22px;height:22px;fill:none;stroke:#fff;stroke-width:2.6;stroke-linecap:round;stroke-linejoin:round}
.sub{margin-top:14px;font-size:13px;color:#a8a8a8}
.note{margin-top:22px;max-width:380px;font-size:12px;line-height:1.6;color:#8a8a8a}
footer{margin-top:44px;font-size:11px;letter-spacing:.3em;color:#777}
footer b{display:block;margin-top:6px;font-size:16px;letter-spacing:.28em;color:var(--red)}
@media(max-width:520px){.phone{border-radius:20px;padding:4px}.phone img{border-radius:16px}.l{transform:rotateZ(-3deg) translateX(6%)}.r{transform:rotateZ(3deg) translateX(-6%) translateY(-10px)}}
@media(prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
